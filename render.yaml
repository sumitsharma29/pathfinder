# Render Infrastructure Blueprint for PathFinder Nexus (100% FREE Tier Web Service)
# Zero Credit Card / $0.00 Free Cloud Deployment

services:
  - type: web
    name: pathfinder-nexus-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python scripts/deploy_init.py
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: "PathFinder Nexus"
      - key: APP_ENV
        value: "production"
      - key: APP_VERSION
        value: "1.0.0"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://*.netlify.app,http://localhost:5173"
      - key: DATABASE_URL
        value: "sqlite:///./pathfinder.db"
      - key: EMBEDDING_PROVIDER
        value: "mock"
      - key: LLM_PROVIDER
        value: "mock"
      - key: LLM_MODEL
        value: "gemini-1.5-flash"
      - key: LLM_API_KEY
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
    healthCheckPath: /health
