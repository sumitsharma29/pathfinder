<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="nexus-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="nexus-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="nexus-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Orbit Rings -->
  <circle cx="256" cy="256" r="210" stroke="url(#nexus-grad-1)" stroke-width="3" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="160" stroke="#0ea5e9" stroke-width="2" opacity="0.3" />
  <circle cx="256" cy="256" r="110" stroke="#10b981" stroke-width="2.5" stroke-dasharray="12 6" opacity="0.6" />

  <!-- Outer Topological Star / Diamond Track -->
  <polygon points="256,56 456,256 256,456 56,256" stroke="url(#nexus-grad-1)" stroke-width="6" fill="none" opacity="0.8" filter="url(#nexus-glow)" />

  <!-- Neural Constellation Lines -->
  <line x1="256" y1="56" x2="256" y2="456" stroke="url(#nexus-grad-2)" stroke-width="3" opacity="0.5" />
  <line x1="56" y1="256" x2="456" y2="256" stroke="url(#nexus-grad-2)" stroke-width="3" opacity="0.5" />
  <line x1="115" y1="115" x2="397" y2="397" stroke="url(#nexus-grad-1)" stroke-width="2.5" opacity="0.4" />
  <line x1="397" y1="115" x2="115" y2="397" stroke="url(#nexus-grad-1)" stroke-width="2.5" opacity="0.4" />

  <!-- Outer Milestone Nodes -->
  <circle cx="256" cy="56" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="4" filter="url(#nexus-glow)" />
  <circle cx="456" cy="256" r="16" fill="#059669" stroke="#34d399" stroke-width="4" filter="url(#nexus-glow)" />
  <circle cx="256" cy="456" r="16" fill="#2563eb" stroke="#60a5fa" stroke-width="4" filter="url(#nexus-glow)" />
  <circle cx="56" cy="256" r="16" fill="#0d9488" stroke="#2dd4bf" stroke-width="4" filter="url(#nexus-glow)" />

  <!-- Inner Dynamic Arrow Navigation Glyph -->
  <path d="M256 120 L340 330 L256 285 L172 330 Z" fill="url(#nexus-grad-1)" filter="url(#core-glow)" />
  <path d="M256 140 L320 310 L256 275 L192 310 Z" fill="#0f172a" opacity="0.6" />

  <!-- Central Nexus Energy Core -->
  <circle cx="256" cy="256" r="22" fill="#38bdf8" filter="url(#nexus-glow)" />
  <circle cx="256" cy="256" r="12" fill="#ffffff" />
</svg>
