version: "3.8"

services:
  # PostgreSQL Database with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: pathfinder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pathfinder}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pathfinder}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pathfinder-net

  # FastAPI Backend API Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pathfinder-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_NAME=PathFinder AI
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pathfinder}
      - SECRET_KEY=${SECRET_KEY:-pathfinder_production_secret_key_change_in_real_env_2026}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1536}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-mock}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_MODEL=${LLM_MODEL:-gemini-3.6-flash}
      - LLM_API_KEY=${LLM_API_KEY}
    ports:
      - "8000:8000"
    networks:
      - pathfinder-net

  # React Frontend (Nginx SPA)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pathfinder-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - pathfinder-net

volumes:
  postgres_data:
    driver: local

networks:
  pathfinder-net:
    driver: bridge
